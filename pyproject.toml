[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toystudio"
version = "0.1.0"
description = "Той Студия: auto-editing of celebration videos"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8", "psutil"]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt", "ruff", "mypy", "import-linter"]

[tool.hatch.build.targets.wheel]
packages = ["toystudio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = "toystudio.core.*"
strict = true
